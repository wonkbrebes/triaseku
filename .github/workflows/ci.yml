name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Unit, API, dan gate skenario keselamatan AI
        run: pytest -q
      - run: docker build -t triaseku-backend .
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: triaseku-backend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash ../scripts/setup_android.sh
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: triaseku-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
